services:
  - type: web
    name: prysm-forum
    runtime: node
    plan: free
    region: frankfurt
    branch: ui-redesign-v2
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
