<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17131d"/><stop offset=".52" stop-color="#25172b"/><stop offset="1" stop-color="#10242b"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".45" r=".7"><stop stop-color="#ff2d86" stop-opacity=".25"/><stop offset="1" stop-color="#ff2d86" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#fff" opacity=".08"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#glow)"/>
